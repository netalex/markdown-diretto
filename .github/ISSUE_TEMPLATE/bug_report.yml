name: Segnalazione problema
description: Un comportamento riproducibile di Markdown Diretto.
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: Versione dell’estensione
      placeholder: '0.2.0'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Thunderbird e sistema operativo
      placeholder: 'Thunderbird 155.0.1, Windows 64 bit'
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Dove si verifica?
      options:
        - Composizione
        - Lettura nel riquadro principale
        - Lettura in scheda o finestra
        - Installazione o aggiornamento
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passi per riprodurre
      description: Usa testo fittizio; non allegare email reali o dati personali.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Risultato atteso e risultato osservato
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Messaggio di errore
      description: Riporta il testo esatto, rimuovendo eventuali dati personali.
